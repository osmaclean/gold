name: Supabase Keepalive

# Roda diariamente e mantém o projeto Supabase ativo no free tier.
# Free tier pausa após ~1 semana sem atividade. Diário dá uma margem confortável.
#
# Pré-requisitos: adicionar como GitHub Secrets (Settings → Secrets and variables → Actions):
#   - DATABASE_URL  (Supabase: Transaction pooler 6543 com ?pgbouncer=true&connection_limit=1)
#   - DIRECT_URL    (Supabase: Session pooler 5432)

on:
  schedule:
    - cron: "0 12 * * *" # diariamente às 12:00 UTC (09:00 Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Ping Supabase
        run: pnpm exec tsx scripts/keepalive.ts
